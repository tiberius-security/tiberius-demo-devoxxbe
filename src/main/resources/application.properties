spring.application.name=devoxxbe
server.port=8081

# Ollama Configuration
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:1b
ollama.timeout=60

# Tiberius Configuration
tiberius.enabled=true
tiberius.generator=ollama
tiberius.model=llama3.2:1b
tiberius.ollama-base-url=http://localhost:11434
tiberius.concurrency=10
tiberius.min-severity=1
tiberius.max-success-rate=0.0
tiberius.fail-fast=false
tiberius.categories=JAILBREAK,ENCODING,PROMPT_INJECTION,DATA_EXTRACTION,MULTI_TURN,FORMAT_EXPLOIT,CONTEXT_MANIPULATION,ADVERSARIAL,SAFETY_BENCHMARK,EVASION,BIAS_EVALUATION,CONTEXTUAL_EMBEDDING

# Guardrails Configuration
# Set to false to disable input guardrails (makes bot vulnerable - for testing only!)
guardrails.content-safety.enabled=false
